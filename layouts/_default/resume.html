{{ define "body-class" }}resume-page{{ end }}

{{ define "head" }}
<style>
    .resume-page-wrap {
        width: 100%;
        max-width: 1080px;
        margin: 0;
        padding: 0 0 48px;
    }

    .resume-actions {
        gap: 12px;
    }

    .resume-export-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 0 18px;
        border: 1px solid rgba(22, 106, 104, 0.24);
        border-radius: 8px;
        color: #ffffff;
        background: #166a68;
        box-shadow: 0 14px 30px rgba(35, 40, 48, 0.18);
        font: 700 14px/1 -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        cursor: pointer;
        white-space: normal;
    }

    .resume-export-button:hover {
        background: #105856;
    }

    .resume-pdf-area {
        --paper: #fffdf8;
        --ink: #202225;
        --muted: #62666d;
        --line: #d8d5ce;
        --soft-line: #ede8de;
        --accent: #166a68;
        --accent-2: #9d5b2d;
        --wash: #e7f0ec;
        --strong: #0d0f10;
        --heading: #24272b;
        --body-copy: #33373d;
        --body-strong: #30343a;
        --label: #25282d;
        --date: #4e5359;
        --bullet: #2e3237;
        --link: #1f5554;
        --portrait-border: rgba(255, 255, 255, 0.8);
        --texture-accent: rgba(22, 106, 104, 0.09);
        --texture-line: rgba(32, 34, 37, 0.018);
        --shadow: 0 24px 70px rgba(35, 40, 48, 0.14);
        --sans: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        --serif: "Songti SC", "Noto Serif SC", STSong, serif;
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.72;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }

    .resume-pdf-area * {
        box-sizing: border-box;
    }

    .resume-document {
        position: relative;
        overflow: hidden;
        background: var(--paper);
        border-radius: 4px;
        box-shadow: var(--shadow);
    }

    .resume-document::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(90deg, var(--texture-accent), transparent 22%),
            repeating-linear-gradient(0deg, transparent 0, transparent 31px, var(--texture-line) 32px);
        opacity: 0.75;
    }

    .resume-content {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 34px;
        padding: 62px 70px 70px;
    }

    .resume-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 124px;
        gap: 30px;
        align-items: start;
        padding-bottom: 30px;
        border-bottom: 1px solid var(--line);
    }

    .resume-identity {
        display: grid;
        gap: 16px;
    }

    .resume-name {
        margin: 0;
        color: var(--strong);
        font-family: var(--serif);
        font-size: clamp(40px, 6vw, 66px);
        line-height: 0.98;
        letter-spacing: 0;
    }

    .resume-contact,
    .resume-intent {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
    }

    .resume-intent {
        max-width: 760px;
        color: var(--body-strong);
        font-weight: 560;
    }

    .resume-portrait {
        width: 124px;
        aspect-ratio: 1;
        border-radius: 18px;
        object-fit: cover;
        object-position: center;
        border: 1px solid var(--portrait-border);
        box-shadow: 0 18px 40px rgba(25, 36, 40, 0.20);
    }

    .resume-section {
        display: grid;
        grid-template-columns: 156px minmax(0, 1fr);
        gap: 30px;
        break-inside: auto;
    }

    .resume-section-title {
        position: sticky;
        top: 24px;
        align-self: start;
        margin: 0;
        padding-top: 3px;
        color: var(--strong);
        font-family: var(--serif);
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
    }

    .resume-section-title::after {
        content: "";
        display: block;
        width: 44px;
        height: 3px;
        margin-top: 14px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .resume-section-body {
        min-width: 0;
        display: grid;
        gap: 22px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--soft-line);
    }

    .resume-section:last-child .resume-section-body {
        border-bottom: 0;
    }

    .resume-advantage-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        counter-reset: advantage;
        list-style: none;
    }

    .resume-advantage-list li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        align-items: baseline;
        color: var(--body-strong);
        font-size: 15.2px;
        break-inside: avoid;
    }

    .resume-advantage-list li::before {
        counter-increment: advantage;
        content: counter(advantage) ".";
        color: var(--accent);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
    }

    .resume-entry {
        position: relative;
        display: grid;
        gap: 12px;
        padding: 0 0 18px 24px;
        break-inside: avoid;
    }

    .resume-entry::before {
        content: "";
        position: absolute;
        top: 8px;
        bottom: -8px;
        left: 5px;
        width: 1px;
        background: var(--soft-line);
    }

    .resume-entry:last-child {
        padding-bottom: 0;
    }

    .resume-entry:last-child::before {
        bottom: 8px;
    }

    .resume-entry::after {
        content: "";
        position: absolute;
        top: 7px;
        left: 0;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--paper);
        border: 2px solid var(--accent);
        box-shadow: 0 0 0 5px var(--wash);
    }

    .resume-entry-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: baseline;
    }

    .resume-entry-name {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        align-items: baseline;
        min-width: 0;
    }

    .resume-heading {
        margin: 0;
        color: var(--heading);
        font-size: 18px;
        line-height: 1.45;
        letter-spacing: 0;
    }

    .resume-role,
    .resume-date {
        color: var(--muted);
        font-size: 14.2px;
        line-height: 1.45;
        white-space: nowrap;
    }

    .resume-date {
        color: var(--date);
        font-variant-numeric: tabular-nums;
    }

    .resume-badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 8px;
        border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
        border-radius: 999px;
        color: var(--accent);
        background: color-mix(in srgb, var(--wash) 62%, transparent);
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
    }

    .resume-block {
        display: grid;
        gap: 8px;
    }

    .resume-label {
        margin: 0;
        color: var(--label);
        font-size: 15px;
        font-weight: 800;
        line-height: 1.55;
    }

    .resume-pdf-area p {
        margin: 0;
        color: var(--body-copy);
        font-size: 14.6px;
        line-height: 1.86;
        text-wrap: pretty;
    }

    .resume-pdf-area ul,
    .resume-pdf-area ol {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 1.15em;
        color: var(--body-copy);
        font-size: 14.6px;
        line-height: 1.82;
    }

    .resume-pdf-area li {
        padding-left: 0.1em;
        break-inside: avoid;
    }

    .resume-plain-list {
        list-style: none;
        padding-left: 0;
    }

    .resume-plain-list li {
        display: grid;
        grid-template-columns: 1.15em minmax(0, 1fr);
        gap: 0.25em;
    }

    .resume-plain-list li::before {
        content: "●";
        color: var(--bullet);
    }

    .resume-link-line {
        color: var(--link);
        font-weight: 650;
        overflow-wrap: anywhere;
    }

    [data-scheme="dark"] .resume-pdf-area {
        --paper: #242629;
        --ink: #efeae1;
        --muted: #b8b1a6;
        --line: #4b4740;
        --soft-line: #393734;
        --accent: #82d1ca;
        --accent-2: #d79b6a;
        --wash: rgba(130, 209, 202, 0.14);
        --strong: #fbf7ef;
        --heading: #f2ede4;
        --body-copy: #d8d1c6;
        --body-strong: #e6ded2;
        --label: #f0e8dc;
        --date: #c4bdb2;
        --bullet: #cfc7bc;
        --link: #91d9d2;
        --portrait-border: rgba(255, 255, 255, 0.16);
        --texture-accent: rgba(130, 209, 202, 0.08);
        --texture-line: rgba(255, 255, 255, 0.026);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    [data-scheme="dark"] .resume-export-button {
        border-color: rgba(130, 209, 202, 0.28);
        background: #237c78;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.32);
    }

    [data-scheme="dark"] .resume-export-button:hover {
        background: #2c918c;
    }

    .resume-education-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: baseline;
        padding-left: 24px;
    }

    .resume-education-main {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 30px;
        align-items: baseline;
    }

    .resume-certificate {
        padding-left: 24px;
    }

    @media (max-width: 860px) {
        .resume-page-wrap {
            padding: 0 0 34px;
        }

        .resume-document {
            border-radius: 0;
        }

        .resume-content {
            padding: 34px 22px 42px;
            gap: 28px;
        }

        .resume-hero {
            grid-template-columns: 1fr;
            gap: 22px;
        }

        .resume-portrait {
            width: 108px;
            grid-row: 1;
        }

        .resume-section {
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .resume-section-title {
            position: static;
        }

        .resume-entry-head,
        .resume-education-row {
            grid-template-columns: 1fr;
        }

        .resume-date,
        .resume-role {
            white-space: normal;
        }
    }

    @media (min-width: 1024px) and (max-width: 1535px) {
        body.resume-page .main-container.extended {
            --right-sidebar-max-width: clamp(104px, 12vw, 156px);
            column-gap: clamp(18px, 2.2vw, 28px);
        }

        body.resume-page .right-sidebar {
            flex: 0 1 var(--right-sidebar-max-width);
            width: min(100%, var(--right-sidebar-max-width));
            min-width: 0;
        }

        body.resume-page .resume-actions {
            min-width: 0;
        }

        body.resume-page .resume-export-button {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 40px;
            padding: 0 10px;
            font-size: 13px;
            line-height: 1.25;
        }
    }

</style>
{{ end }}

{{ define "main" }}
    <section class="resume-page-wrap" aria-label="个人简历" data-resume-root data-annotation-scope="resume">
        <div id="resume-pdf-area" class="resume-pdf-area">
            {{ .Content }}
        </div>
        <div class="resume-drawer-root" data-resume-drawer-root hidden></div>
    </section>

    {{ partialCached "footer/footer" . }}
{{ end }}

{{ define "right-sidebar" }}
    <aside class="sidebar right-sidebar sticky">
        <section class="widget resume-actions">
            <div class="widget-icon">
                {{ partial "helper/icon" "archives" }}
            </div>
            <h2 class="widget-title section-title">简历操作</h2>
            <a class="resume-export-button" href="/resume/resume.pdf" download>下载 PDF</a>
        </section>
    </aside>
{{ end }}
